<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 50" width="1000" height="50" role="presentation">
  <defs>
    <path id="wave" d="M0 34 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.08" stop-color="#fff"/>
      <stop offset="0.92" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="m"><rect width="1000" height="50" fill="url(#fade)"/></mask>
    <path id="spark" d="M0 -11 C1.5 -3 3 -1.5 11 0 C3 1.5 1.5 3 0 11 C-1.5 3 -3 1.5 -11 0 C-3 -1.5 -1.5 -3 0 -11 Z"/>
  </defs>

  <g mask="url(#m)">
    <use xlink:href="#wave" transform="translate(0 5)" fill="none" stroke="#B9A6FF" stroke-width="2.5" stroke-linecap="round"/>
    <use xlink:href="#wave" fill="none" stroke="#FF6FB5" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0 12"/>

    <!-- a tiny jellyfish tiptoeing along the line -->
    <g>
      <animateMotion dur="18s" repeatCount="indefinite"><mpath xlink:href="#wave"/></animateMotion>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" dur="1.1s" repeatCount="indefinite"/>
        <g fill="none" stroke="#241E4E" stroke-width="2" stroke-linecap="round">
          <path d="M-6 -9 q-2 4 0 8"><animate attributeName="d" values="M-6 -9 q-2 4 0 8;M-6 -9 q2 4 0 8;M-6 -9 q-2 4 0 8" dur="0.9s" repeatCount="indefinite"/></path>
          <path d="M0 -9 q2 4 0 8"><animate attributeName="d" values="M0 -9 q2 4 0 8;M0 -9 q-2 4 0 8;M0 -9 q2 4 0 8" dur="0.9s" repeatCount="indefinite"/></path>
          <path d="M6 -9 q-2 4 0 8"><animate attributeName="d" values="M6 -9 q-2 4 0 8;M6 -9 q2 4 0 8;M6 -9 q-2 4 0 8" dur="0.9s" repeatCount="indefinite"/></path>
        </g>
        <path d="M-12 -10 C-12 -26 12 -26 12 -10 Q8.5 -7 5.5 -10 Q2.5 -7 0 -10 Q-2.5 -7 -5.5 -10 Q-8.5 -7 -12 -10 Z" fill="#B9A6FF" stroke="#241E4E" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="-4" cy="-16" r="1.6" fill="#241E4E"/>
        <circle cx="4" cy="-16" r="1.6" fill="#241E4E"/>
        <ellipse cx="-7.5" cy="-13" rx="2.2" ry="1.3" fill="#FF6FB5"/>
        <ellipse cx="7.5" cy="-13" rx="2.2" ry="1.3" fill="#FF6FB5"/>
      </g>
    </g>
  </g>

  <g transform="translate(180 12)"><use xlink:href="#spark" fill="#FFD45C" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.35;0.7;0.35" dur="2.4s" repeatCount="indefinite"/></use></g>
  <g transform="translate(820 13)"><use xlink:href="#spark" fill="#7EE0B5" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.35;0.7;0.35" dur="2.8s" begin="-1.2s" repeatCount="indefinite"/></use></g>
</svg>
