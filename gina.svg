<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 220" width="260" height="220" role="img" aria-label="GINA sticker: a question in a speech bubble turns into a bar chart, and the last bar says aha">
  <defs>
    <clipPath id="c"><rect x="4" y="4" width="244" height="204" rx="18"/></clipPath>
    <path id="spark" d="M0 -11 C1.5 -3 3 -1.5 11 0 C3 1.5 1.5 3 0 11 C-1.5 3 -3 1.5 -11 0 C-3 -1.5 -1.5 -3 0 -11 Z"/>
  </defs>

  <rect x="12" y="12" width="244" height="204" rx="18" fill="#FFD45C" stroke="#241E4E" stroke-width="2.5"/>
  <rect x="4" y="4" width="244" height="204" rx="18" fill="#FFF6EC"/>

  <g clip-path="url(#c)">
    <!-- the question -->
    <rect x="20" y="20" width="178" height="38" rx="19" fill="#FFFFFF" stroke="#241E4E" stroke-width="2.5"/>
    <path d="M44 57 L34 74 L60 57" fill="#FFFFFF" stroke="#241E4E" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="46" y1="58" x2="58" y2="58" stroke="#FFFFFF" stroke-width="4"/>
    <text x="109" y="43" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#241E4E">why did revenue drop?</text>

    <!-- the answer, growing -->
    <g stroke="#241E4E" stroke-width="2">
      <rect x="40" y="170" width="24" height="0" rx="3" fill="#5B7CFA">
        <animate attributeName="height" values="0;64;64;0" keyTimes="0;0.25;0.85;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="170;106;106;170" keyTimes="0;0.25;0.85;1" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="76" y="170" width="24" height="0" rx="3" fill="#B9A6FF">
        <animate attributeName="height" values="0;84;84;0" keyTimes="0;0.25;0.85;1" dur="5s" begin="0.15s" repeatCount="indefinite"/>
        <animate attributeName="y" values="170;86;86;170" keyTimes="0;0.25;0.85;1" dur="5s" begin="0.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="112" y="170" width="24" height="0" rx="3" fill="#7EE0B5">
        <animate attributeName="height" values="0;54;54;0" keyTimes="0;0.25;0.85;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="170;116;116;170" keyTimes="0;0.25;0.85;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="148" y="170" width="24" height="0" rx="3" fill="#5B7CFA">
        <animate attributeName="height" values="0;92;92;0" keyTimes="0;0.25;0.85;1" dur="5s" begin="0.45s" repeatCount="indefinite"/>
        <animate attributeName="y" values="170;78;78;170" keyTimes="0;0.25;0.85;1" dur="5s" begin="0.45s" repeatCount="indefinite"/>
      </rect>
      <rect x="184" y="170" width="24" height="0" rx="3" fill="#FF6FB5">
        <animate attributeName="height" values="0;30;30;0" keyTimes="0;0.25;0.85;1" dur="5s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="170;140;140;170" keyTimes="0;0.25;0.85;1" dur="5s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <line x1="30" y1="170" x2="226" y2="170" stroke="#241E4E" stroke-width="2.5" stroke-linecap="round"/>

    <!-- aha! -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.8s" repeatCount="indefinite"/>
      <text x="210" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="17" fill="#FF6FB5">aha!</text>
      <path d="M206 112 Q194 120 198 132 M193 127 L198 133 L204 128" fill="none" stroke="#FF6FB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(222 34)"><use xlink:href="#spark" fill="#FFD45C" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.5;0.9;0.5" dur="2.4s" repeatCount="indefinite"/></use></g>
  </g>

  <text x="126" y="194" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#241E4E">NO.04 · DATA, BUT CHATTY</text>
  <rect x="4" y="4" width="244" height="204" rx="18" fill="none" stroke="#241E4E" stroke-width="2.5"/>
</svg>
