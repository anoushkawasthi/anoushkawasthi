<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1012 300" width="1012" height="300" role="img" aria-label="A postcard from the deep end — thanks for swimming all the way down here. ikyano.tech">
  <defs>
    <pattern id="airmail" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="36" height="36" fill="#FFF6EC"/>
      <rect x="0" width="9" height="36" fill="#FF6FB5"/>
      <rect x="18" width="9" height="36" fill="#5B7CFA"/>
    </pattern>
    <pattern id="paperDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.2" fill="#241E4E" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect x="4" y="4" width="990" height="276" rx="18"/></clipPath>
    <path id="pm" d="M -37,0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0"/>
    <path id="spark" d="M0 -11 C1.5 -3 3 -1.5 11 0 C3 1.5 1.5 3 0 11 C-1.5 3 -3 1.5 -11 0 C-3 -1.5 -1.5 -3 0 -11 Z"/>
    <style>
      @keyframes bubble { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .55; } 100% { transform: translateY(-230px); opacity: 0; } }
      .b { animation: bubble linear infinite; }
      @keyframes draw { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
      .squig { stroke-dasharray: 340; animation: draw 1.4s cubic-bezier(.3,.8,.3,1) .3s both; }
    </style>
  </defs>

  <rect x="16" y="16" width="990" height="276" rx="18" fill="#FF6FB5" stroke="#241E4E" stroke-width="3"/>
  <rect x="4" y="4" width="990" height="276" rx="18" fill="#FFF6EC"/>

  <g clip-path="url(#card)">
    <rect x="4" y="4" width="990" height="276" fill="url(#paperDots)"/>

    <!-- drifting bubbles -->
    <g fill="none" stroke="#5B7CFA" stroke-width="1.6">
      <circle class="b" cx="320" cy="270" r="4" style="animation-duration:9s;animation-delay:0s"/>
      <circle class="b" cx="480" cy="270" r="6" style="animation-duration:11s;animation-delay:3s"/>
      <circle class="b" cx="560" cy="270" r="3" style="animation-duration:8s;animation-delay:5s"/>
      <circle class="b" cx="720" cy="270" r="5" style="animation-duration:10s;animation-delay:1.5s"/>
      <circle class="b" cx="960" cy="270" r="4" style="animation-duration:12s;animation-delay:6s"/>
    </g>

    <!-- airmail border -->
    <rect x="14" y="14" width="970" height="256" rx="10" fill="none" stroke="url(#airmail)" stroke-width="10"/>

    <!-- message side -->
    <text x="56" y="80" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#241E4E">postcard from the deep end</text>
    <path class="squig" d="M58 96 q12 -8 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#FF6FB5" stroke-width="4" stroke-linecap="round"/>

    <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17.5" fill="#241E4E" fill-opacity="0.85">
      <text x="58" y="136">thanks for swimming all the way down here.</text>
      <text x="58" y="164">if you're building something weird and wonderful,</text>
      <text x="58" y="192">i'd love to hear about it.</text>
    </g>
    <text x="58" y="238" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25" fill="#FF6FB5">— anoushka</text>
    <g transform="translate(200 228)"><use xlink:href="#spark" fill="#FFD45C" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/></use></g>

    <line x1="592" y1="50" x2="592" y2="240" stroke="#241E4E" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- cancellation waves -->
    <g fill="none" stroke="#241E4E" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
      <path d="M620 96 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
      <path d="M620 106 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
      <path d="M620 116 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
      <path d="M620 126 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
    </g>

    <!-- stamp -->
    <g transform="translate(882 104) rotate(5)">
      <rect x="-48" y="-56" width="100" height="116" fill="#241E4E"/>
      <rect x="-52" y="-60" width="100" height="116" fill="#FFFFFF" stroke="#241E4E" stroke-width="2" stroke-dasharray="4 3"/>
      <rect x="-42" y="-50" width="80" height="78" fill="#FFD45C" stroke="#241E4E" stroke-width="2"/>
      <text x="-36" y="-37" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#241E4E">₹∞</text>
      <g transform="translate(-2 6)">
        <animateTransform attributeName="transform" type="translate" values="-2 6;-2 1;-2 6" dur="3.6s" repeatCount="indefinite"/>
        <g fill="none" stroke="#241E4E" stroke-width="2" stroke-linecap="round">
          <path d="M-8 -9 q-3 5 0 10"/><path d="M0 -9 q3 5 0 10"/><path d="M8 -9 q-3 5 0 10"/>
        </g>
        <path d="M-16 -9 C-16 -30 16 -30 16 -9 Q12 -5 8 -9 Q4 -5 0 -9 Q-4 -5 -8 -9 Q-12 -5 -16 -9 Z" fill="#B9A6FF" stroke="#241E4E" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="-5" cy="-17" r="2" fill="#241E4E"/>
        <circle cx="5" cy="-17" r="2" fill="#241E4E"/>
        <ellipse cx="-10" cy="-13" rx="2.6" ry="1.5" fill="#FF6FB5"/>
        <ellipse cx="10" cy="-13" rx="2.6" ry="1.5" fill="#FF6FB5"/>
      </g>
      <text x="-2" y="44" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="8" font-weight="700" letter-spacing="0.8" fill="#241E4E">DEEP SEA POST</text>
    </g>

    <!-- postmark, wobbling -->
    <g transform="translate(790 112)">
      <g opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" values="-10;6;-10" dur="7s" repeatCount="indefinite"/>
        <circle r="44" fill="none" stroke="#241E4E" stroke-width="2"/>
        <circle r="31" fill="none" stroke="#241E4E" stroke-width="1.5"/>
        <text font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="7.5" font-weight="700" fill="#241E4E"><textPath xlink:href="#pm" textLength="226">PATIALA ✦ 2026 ✦ PATIALA ✦ 2026 ✦ </textPath></text>
        <text y="4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1" fill="#241E4E">IKYANO</text>
      </g>
    </g>

    <!-- address -->
    <text x="624" y="204" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#241E4E">to: you, a curious visitor</text>
    <line x1="620" y1="212" x2="960" y2="212" stroke="#241E4E" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="624" y="236" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#241E4E" fill-opacity="0.8">ikyano.tech · github.com/anoushkawasthi</text>
    <line x1="620" y1="244" x2="960" y2="244" stroke="#241E4E" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <rect x="4" y="4" width="990" height="276" rx="18" fill="none" stroke="#241E4E" stroke-width="3"/>
</svg>
