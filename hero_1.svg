<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1012 352" width="1012" height="352" role="img" aria-label="Anoushka Awasthi — a little bit of code, a little bit of chaos, mostly curiosity">
  <defs>
    <pattern id="paperDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.2" fill="#241E4E" fill-opacity="0.07"/>
    </pattern>
    <pattern id="halftone" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <circle cx="4.5" cy="4.5" r="2.1" fill="#FF6FB5" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect x="4" y="4" width="990" height="330" rx="22"/></clipPath>
    <path id="ring" d="M -50,0 a 50,50 0 1,1 100,0 a 50,50 0 1,1 -100,0"/>
    <path id="spark" d="M0 -11 C1.5 -3 3 -1.5 11 0 C3 1.5 1.5 3 0 11 C-1.5 3 -3 1.5 -11 0 C-3 -1.5 -1.5 -3 0 -11 Z"/>
    <style>
      .riso { mix-blend-mode: multiply; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
      .in1 { animation: rise .9s cubic-bezier(.2,.9,.3,1.15) both; }
      .in2 { animation: rise .9s cubic-bezier(.2,.9,.3,1.15) .15s both; }
      .in3 { animation: rise .9s cubic-bezier(.2,.9,.3,1.15) .35s both; }
      .squig { stroke-dasharray: 420; animation: draw 1.3s cubic-bezier(.3,.8,.3,1) .5s both; }
    </style>
  </defs>

  <!-- offset sticker shadow + paper -->
  <rect x="16" y="16" width="990" height="330" rx="22" fill="#5B7CFA" stroke="#241E4E" stroke-width="3"/>
  <rect x="4" y="4" width="990" height="330" rx="22" fill="#FFF6EC"/>

  <g clip-path="url(#card)">
    <rect x="4" y="4" width="990" height="330" fill="url(#paperDots)"/>

    <!-- halftone sun with slowly turning rays -->
    <g stroke="#241E4E" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 948 24" to="360 948 24" dur="40s" repeatCount="indefinite"/>
      <line x1="1066" y1="24" x2="1086" y2="24"/>
      <line x1="1050.2" y1="83" x2="1067.5" y2="93"/>
      <line x1="1007" y1="126.2" x2="1017" y2="143.5"/>
      <line x1="948" y1="142" x2="948" y2="162"/>
      <line x1="889" y1="126.2" x2="879" y2="143.5"/>
      <line x1="845.8" y1="83" x2="828.5" y2="93"/>
      <line x1="830" y1="24" x2="810" y2="24"/>
      <line x1="845.8" y1="-35" x2="828.5" y2="-45"/>
      <line x1="889" y1="-78.2" x2="879" y2="-95.5"/>
      <line x1="948" y1="-94" x2="948" y2="-114"/>
      <line x1="1007" y1="-78.2" x2="1017" y2="-95.5"/>
      <line x1="1050.2" y1="-35" x2="1067.5" y2="-45"/>
    </g>
    <circle cx="948" cy="24" r="104" fill="#FFD45C" stroke="#241E4E" stroke-width="3"/>
    <circle cx="948" cy="24" r="102" fill="url(#halftone)"/>

    <!-- twinkles -->
    <g transform="translate(592 74)"><use xlink:href="#spark" fill="#FFD45C" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.7;1.15;0.7" dur="2.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(402 186)"><use xlink:href="#spark" fill="#7EE0B5" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.6;1.05;0.6" dur="2.8s" begin="-0.8s" repeatCount="indefinite"/></use></g>
    <g transform="translate(782 130)"><use xlink:href="#spark" fill="#FF6FB5" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.55;0.95;0.55" dur="2.2s" begin="-1.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(566 168)"><use xlink:href="#spark" fill="#5B7CFA" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.5;0.9;0.5" dur="2.6s" begin="-0.3s" repeatCount="indefinite"/></use></g>
    <g transform="translate(966 300)"><use xlink:href="#spark" fill="#FFD45C" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.6;1.1;0.6" dur="3s" begin="-0.5s" repeatCount="indefinite"/></use></g>
    <g transform="translate(470 44)"><use xlink:href="#spark" fill="#B9A6FF" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.5;0.9;0.5" dur="2.5s" begin="-1.9s" repeatCount="indefinite"/></use></g>

    <!-- "hello, i'm" tag -->
    <g transform="rotate(-4 114 49)">
      <rect x="48" y="34" width="136" height="30" rx="15" fill="#FFD45C" stroke="#241E4E" stroke-width="2.5"/>
      <text x="116" y="54" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#241E4E">hello, i'm ✦</text>
    </g>

    <!-- name: off-register riso print -->
    <g class="in1">
      <text x="48" y="140" font-family="'Arial Black', 'Arial Bold', Gadget, 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-1.5" fill="#5B7CFA" class="riso" transform="translate(-5 4)"><animateTransform attributeName="transform" type="translate" values="-5 4;-3 6;-6 3;-5 4" dur="6s" repeatCount="indefinite"/>Anoushka</text>
      <text x="48" y="140" font-family="'Arial Black', 'Arial Bold', Gadget, 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-1.5" fill="#FF6FB5" class="riso">Anoushka</text>
    </g>
    <text class="in2" x="52" y="224" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="#241E4E">Awasthi</text>
    <path class="squig" d="M54 244 q15 -9 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#FF6FB5" stroke-width="5" stroke-linecap="round"/>

    <g class="in3">
      <text x="50" y="282" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#241E4E">a little bit of code, a little bit of chaos, mostly curiosity.</text>
      <text x="50" y="314" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.6" fill="#241E4E" fill-opacity="0.7">ai systems ✿ backend architecture ✿ developer tools ✿ samsung prism</text>
    </g>

    <!-- rotating winner stamp -->
    <g transform="translate(700 232) rotate(-10)">
      <circle cx="4" cy="4" r="64" fill="#241E4E"/>
      <circle r="64" fill="#FF6FB5" stroke="#241E4E" stroke-width="3"/>
      <circle r="41" fill="#FFF6EC" stroke="#241E4E" stroke-width="2.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
        <text font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#241E4E"><textPath xlink:href="#ring" textLength="300">★ 1ST PLACE ★ ET AI HACKATHON 2.0 </textPath></text>
      </g>
      <text y="6" text-anchor="middle" font-family="'Arial Black', 'Arial Bold', Gadget, Arial, sans-serif" font-size="26" font-weight="900" fill="#241E4E">#1</text>
      <text y="23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="7.5" font-weight="700" letter-spacing="0.6" fill="#241E4E" fill-opacity="0.75">10K+ TEAMS</text>
    </g>

    <!-- jellyfish + speech bubble, bobbing together -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>

      <rect x="605" y="43" width="256" height="52" rx="26" fill="#FF6FB5" stroke="#241E4E" stroke-width="2.5"/>
      <rect x="600" y="38" width="256" height="52" rx="26" fill="#FFFFFF" stroke="#241E4E" stroke-width="2.5"/>
      <path d="M782 89 L834 122 L808 89" fill="#FFFFFF" stroke="#241E4E" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="784" y1="89.5" x2="806" y2="89.5" stroke="#FFFFFF" stroke-width="4"/>

      <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#241E4E" text-anchor="middle">
        <text x="728" y="69" opacity="0">hi! come on in ~<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></text>
        <text x="728" y="69" opacity="0">i build things that think<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></text>
        <text x="728" y="69" opacity="0">&amp; things that remember<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></text>
        <text x="728" y="69" opacity="0">bug or feature? yes.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></text>
      </g>

      <!-- ribbon tentacles -->
      <g fill="none" stroke-linecap="round">
        <path d="M838 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" stroke="#241E4E" stroke-width="8"><animate attributeName="d" values="M838 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20;M838 186 q9 16 0 32 q-9 16 0 32 q6 10 0 20;M838 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" dur="2.4s" repeatCount="indefinite"/></path>
        <path d="M838 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" stroke="#FF6FB5" stroke-width="4"><animate attributeName="d" values="M838 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20;M838 186 q9 16 0 32 q-9 16 0 32 q6 10 0 20;M838 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" dur="2.4s" repeatCount="indefinite"/></path>

        <path d="M860 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" stroke="#241E4E" stroke-width="8"><animate attributeName="d" values="M860 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20;M860 188 q9 16 0 32 q-9 16 0 32 q6 10 0 20;M860 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/></path>
        <path d="M860 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" stroke="#5B7CFA" stroke-width="4"><animate attributeName="d" values="M860 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20;M860 188 q9 16 0 32 q-9 16 0 32 q6 10 0 20;M860 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/></path>

        <path d="M882 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" stroke="#241E4E" stroke-width="8"><animate attributeName="d" values="M882 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20;M882 188 q9 16 0 32 q-9 16 0 32 q6 10 0 20;M882 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></path>
        <path d="M882 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" stroke="#7EE0B5" stroke-width="4"><animate attributeName="d" values="M882 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20;M882 188 q9 16 0 32 q-9 16 0 32 q6 10 0 20;M882 188 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></path>

        <path d="M904 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" stroke="#241E4E" stroke-width="8"><animate attributeName="d" values="M904 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20;M904 186 q9 16 0 32 q-9 16 0 32 q6 10 0 20;M904 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/></path>
        <path d="M904 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" stroke="#FFD45C" stroke-width="4"><animate attributeName="d" values="M904 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20;M904 186 q9 16 0 32 q-9 16 0 32 q6 10 0 20;M904 186 q-9 16 0 32 q9 16 0 32 q-6 10 0 20" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/></path>
      </g>

      <!-- bell -->
      <path d="M818 182 C818 128 922 128 922 182 Q909 192 896 182 Q883 192 870 182 Q857 192 844 182 Q831 192 818 182 Z" fill="#B9A6FF" stroke="#241E4E" stroke-width="3" stroke-linejoin="round"/>
      <path d="M836 162 Q839 147 854 142" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
      <ellipse cx="856" cy="165" rx="4.2" ry="5.5" fill="#241E4E"><animate attributeName="ry" values="5.5;5.5;0.6;5.5;5.5" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="884" cy="165" rx="4.2" ry="5.5" fill="#241E4E"><animate attributeName="ry" values="5.5;5.5;0.6;5.5;5.5" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="846" cy="174" rx="6" ry="3.5" fill="#FF6FB5" fill-opacity="0.75"/>
      <ellipse cx="894" cy="174" rx="6" ry="3.5" fill="#FF6FB5" fill-opacity="0.75"/>
      <path d="M865 173 q5 5 10 0" fill="none" stroke="#241E4E" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="4" y="4" width="990" height="330" rx="22" fill="none" stroke="#241E4E" stroke-width="3"/>
</svg>
