<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 220" width="260" height="220" role="img" aria-label="FlowSync sticker: commits float out of a git graph into a jar labelled WHY?">
  <defs>
    <clipPath id="c"><rect x="4" y="4" width="244" height="204" rx="18"/></clipPath>
    <path id="flight" d="M76 66 C96 6 150 8 180 58"/>
    <path id="spark" d="M0 -11 C1.5 -3 3 -1.5 11 0 C3 1.5 1.5 3 0 11 C-1.5 3 -3 1.5 -11 0 C-3 -1.5 -1.5 -3 0 -11 Z"/>
  </defs>

  <rect x="12" y="12" width="244" height="204" rx="18" fill="#5B7CFA" stroke="#241E4E" stroke-width="2.5"/>
  <rect x="4" y="4" width="244" height="204" rx="18" fill="#FFF6EC"/>

  <g clip-path="url(#c)">
    <!-- git graph -->
    <g fill="none" stroke="#241E4E" stroke-width="3" stroke-linecap="round">
      <line x1="46" y1="34" x2="46" y2="164"/>
      <path d="M46 140 C46 120 76 124 76 104 V66 C76 48 46 52 46 36"/>
    </g>
    <g stroke="#241E4E" stroke-width="2.5">
      <circle cx="46" cy="152" r="7" fill="#FFF6EC"><animate attributeName="fill" values="#FFF6EC;#7EE0B5;#FFF6EC;#FFF6EC" keyTimes="0;0.1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="76" cy="100" r="7" fill="#FFF6EC"><animate attributeName="fill" values="#FFF6EC;#FFD45C;#FFF6EC;#FFF6EC" keyTimes="0;0.1;0.3;1" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="76" cy="68" r="7" fill="#FFF6EC"><animate attributeName="fill" values="#FFF6EC;#FF6FB5;#FFF6EC;#FFF6EC" keyTimes="0;0.1;0.3;1" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="46" cy="100" r="7" fill="#FFF6EC"><animate attributeName="fill" values="#FFF6EC;#B9A6FF;#FFF6EC;#FFF6EC" keyTimes="0;0.1;0.3;1" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="46" cy="36" r="7" fill="#FFF6EC"><animate attributeName="fill" values="#FFF6EC;#5B7CFA;#FFF6EC;#FFF6EC" keyTimes="0;0.1;0.3;1" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- memories flying into the jar -->
    <g stroke="#241E4E" stroke-width="1.5">
      <circle r="5" fill="#FF6FB5" opacity="0">
        <animateMotion dur="3.6s" repeatCount="indefinite"><mpath xlink:href="#flight"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#FFD45C" opacity="0">
        <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#flight"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#7EE0B5" opacity="0">
        <animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite"><mpath xlink:href="#flight"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- the jar -->
    <path d="M150 64 H218 V72 C226 78 228 86 228 96 V152 C228 162 220 168 210 168 H158 C148 168 140 162 140 152 V96 C140 86 142 78 150 72 Z" fill="#FFFFFF" fill-opacity="0.75" stroke="#241E4E" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#241E4E" stroke-width="1.5">
      <circle cx="162" cy="152" r="9" fill="#FF6FB5"><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="184" cy="155" r="8" fill="#7EE0B5"><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.6s" begin="-0.7s" repeatCount="indefinite"/></circle>
      <circle cx="207" cy="150" r="9" fill="#FFD45C"><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="173" cy="133" r="8" fill="#B9A6FF"><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.9s" begin="-0.4s" repeatCount="indefinite"/></circle>
      <circle cx="198" cy="130" r="7" fill="#5B7CFA"><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.3s" begin="-1.6s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M152 92 V140" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <g transform="rotate(-4 184 104)">
      <rect x="158" y="92" width="52" height="24" rx="4" fill="#FFD45C" stroke="#241E4E" stroke-width="2"/>
      <text x="184" y="109" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#241E4E">WHY?</text>
    </g>
    <!-- open lid -->
    <g transform="rotate(-24 148 60)">
      <rect x="146" y="50" width="78" height="14" rx="5" fill="#FF6FB5" stroke="#241E4E" stroke-width="2.5"/>
      <rect x="176" y="44" width="18" height="8" rx="3" fill="#FF6FB5" stroke="#241E4E" stroke-width="2"/>
    </g>

    <g transform="translate(118 34)"><use xlink:href="#spark" fill="#FFD45C" stroke="#241E4E" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="0.5;0.9;0.5" dur="2.4s" repeatCount="indefinite"/></use></g>
  </g>

  <text x="126" y="193" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#241E4E">NO.02 · A JAR OF WHYS</text>
  <rect x="4" y="4" width="244" height="204" rx="18" fill="none" stroke="#241E4E" stroke-width="2.5"/>
</svg>
