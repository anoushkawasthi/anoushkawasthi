<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Anoushka Awasthi — AI Systems, Backend Architecture, Developer Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#04070D"/>
      <stop offset="55%" stop-color="#071525"/>
      <stop offset="100%" stop-color="#0B2434"/>
    </linearGradient>

    <radialGradient id="abyssGlow" cx="50%" cy="118%" r="75%">
      <stop offset="0%" stop-color="#00E5CC" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#0E7490" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#04070D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#FFB84D" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#E6F1FF"/>
      <stop offset="38%"  stop-color="#5EEAD4"/>
      <stop offset="52%"  stop-color="#38BDF8"/>
      <stop offset="68%"  stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#E6F1FF"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.6 0; 0.6 0; -0.6 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5EEAD4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7DD3FC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.08"/>
    </linearGradient>

    <clipPath id="card"><rect x="0" y="0" width="1000" height="320" rx="18"/></clipPath>

    <style>
      @keyframes rise {
        0%   { transform: translateY(40px);  opacity: 0; }
        12%  { opacity: 0.9; }
        82%  { opacity: 0.55; }
        100% { transform: translateY(-300px); opacity: 0; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes draw   { from { stroke-dashoffset: 620; } to { stroke-dashoffset: 0; } }
      @keyframes breathe{ 0%,100% { opacity: .30; } 50% { opacity: .62; } }
      @keyframes sway   { 0%,100% { transform: translateX(0px); } 50% { transform: translateX(7px); } }
      @keyframes pulse  { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.12); } }

      .spore   { animation: rise linear infinite; }
      .ray     { animation: breathe 7s ease-in-out infinite; }
      .jelly   { animation: sway 8s ease-in-out infinite; transform-origin: 880px 150px; }
      .lure    { animation: pulse 4.2s ease-in-out infinite; transform-origin: 880px 96px; }
      .name    { animation: fadeUp 1.1s cubic-bezier(.22,.8,.3,1) both; }
      .kicker  { animation: fadeUp 1.0s cubic-bezier(.22,.8,.3,1) .15s both; }
      .sub     { animation: fadeUp 1.0s cubic-bezier(.22,.8,.3,1) .45s both; }
      .meta    { animation: fadeIn 1.2s ease-out .85s both; }
      .rule    { stroke-dasharray: 620; animation: draw 1.6s cubic-bezier(.22,.8,.3,1) .3s both; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#abyssGlow)"/>

    <!-- light shafts from the surface -->
    <g>
      <polygon class="ray" points="150,0 198,0 262,320 186,320" fill="url(#rayGrad)" style="animation-delay:0s"/>
      <polygon class="ray" points="430,0 462,0 500,320 452,320" fill="url(#rayGrad)" style="animation-delay:1.8s"/>
      <polygon class="ray" points="700,0 744,0 800,320 736,320" fill="url(#rayGrad)" style="animation-delay:3.4s"/>
    </g>

    <!-- bioluminescent spores -->
    <g>
      <circle class="spore" cx="72"  cy="330" r="1.8" fill="#5EEAD4" style="animation-duration:11s;animation-delay:0s"/>
      <circle class="spore" cx="138" cy="330" r="1.2" fill="#7DD3FC" style="animation-duration:14s;animation-delay:2.1s"/>
      <circle class="spore" cx="214" cy="330" r="2.4" fill="#5EEAD4" style="animation-duration:9.5s;animation-delay:4.4s"/>
      <circle class="spore" cx="292" cy="330" r="1.4" fill="#FFB84D" style="animation-duration:13s;animation-delay:1.2s"/>
      <circle class="spore" cx="366" cy="330" r="1.9" fill="#5EEAD4" style="animation-duration:12s;animation-delay:6.0s"/>
      <circle class="spore" cx="448" cy="330" r="1.1" fill="#7DD3FC" style="animation-duration:15s;animation-delay:3.0s"/>
      <circle class="spore" cx="534" cy="330" r="2.1" fill="#5EEAD4" style="animation-duration:10s;animation-delay:7.3s"/>
      <circle class="spore" cx="608" cy="330" r="1.3" fill="#5EEAD4" style="animation-duration:13.5s;animation-delay:5.1s"/>
      <circle class="spore" cx="676" cy="330" r="1.7" fill="#7DD3FC" style="animation-duration:11.5s;animation-delay:8.4s"/>
      <circle class="spore" cx="762" cy="330" r="1.2" fill="#FFB84D" style="animation-duration:16s;animation-delay:2.7s"/>
      <circle class="spore" cx="838" cy="330" r="2.2" fill="#5EEAD4" style="animation-duration:10.5s;animation-delay:9.2s"/>
      <circle class="spore" cx="916" cy="330" r="1.5" fill="#7DD3FC" style="animation-duration:12.5s;animation-delay:4.0s"/>
      <circle class="spore" cx="962" cy="330" r="1.1" fill="#5EEAD4" style="animation-duration:14.5s;animation-delay:6.8s"/>
    </g>

    <!-- jellyfish -->
    <g class="jelly" opacity="0.9">
      <circle class="lure" cx="880" cy="96" r="54" fill="url(#lureGlow)"/>
      <path d="M836 150 Q836 100 880 100 Q924 100 924 150 Q902 142 880 150 Q858 158 836 150 Z" fill="url(#bellGrad)" stroke="#5EEAD4" stroke-opacity="0.45" stroke-width="1.2"/>
      <path d="M850 152 q-5 24 3 42 q7 16 -2 32" fill="none" stroke="#5EEAD4" stroke-opacity="0.38" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M866 155 q4 26 -3 46 q-6 18 3 30"  fill="none" stroke="#7DD3FC" stroke-opacity="0.32" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M882 156 q-3 28 4 48 q6 16 -3 28"  fill="none" stroke="#5EEAD4" stroke-opacity="0.36" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M898 155 q5 24 -2 44 q-6 18 4 32"  fill="none" stroke="#7DD3FC" stroke-opacity="0.30" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M912 152 q-4 26 3 44 q6 16 -3 30"  fill="none" stroke="#5EEAD4" stroke-opacity="0.34" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="866" cy="132" r="2.6" fill="#E6F1FF" fill-opacity="0.8"/>
      <circle cx="894" cy="132" r="2.6" fill="#E6F1FF" fill-opacity="0.8"/>
    </g>

    <!-- type -->
    <g transform="translate(64, 0)">
      <text class="kicker" x="0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="13" letter-spacing="5.5" fill="#FFB84D" fill-opacity="0.92">BUILDING IN THE DEEP END</text>

      <text class="name" x="-2" y="168" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="62" font-weight="700" letter-spacing="2.5" fill="url(#nameGrad)">Anoushka Awasthi</text>

      <line class="rule" x1="0" y1="194" x2="620" y2="194" stroke="url(#ruleGrad)" stroke-width="2" stroke-linecap="round"/>

      <text class="sub" x="0" y="232" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="17" letter-spacing="1.2" fill="#9FB6C9">
        AI Systems <tspan fill="#2DD4BF">·</tspan> Backend Architecture <tspan fill="#2DD4BF">·</tspan> Developer Tools
      </text>

      <text class="meta" x="0" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="12.5" letter-spacing="1.6" fill="#5F7D93">
        Computer Engineering @ Thapar <tspan fill="#2DD4BF" fill-opacity="0.8">//</tspan> Research Intern @ Samsung PRISM <tspan fill="#2DD4BF" fill-opacity="0.8">//</tspan> Patiala, IN
      </text>
    </g>

    <rect x="0.5" y="0.5" width="999" height="319" rx="18" fill="none" stroke="#2DD4BF" stroke-opacity="0.18"/>
  </g>
</svg>
