<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" height="220" role="img" aria-label="SOP Opera sticker: a hard hat singing opera under a spotlight">
  <defs>
    <clipPath id="c"><rect x="4" y="4" width="244" height="204" rx="18"/></clipPath>
    <style>
      @keyframes noteA { 0% { opacity: 0; transform: translate(0,0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(16px,-64px); } }
      @keyframes noteB { 0% { opacity: 0; transform: translate(0,0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-18px,-60px); } }
      .n1 { animation: noteA 3.2s ease-out infinite; }
      .n2 { animation: noteB 3.2s ease-out 1.1s infinite; opacity: 0; }
      .n3 { animation: noteA 3.2s ease-out 2.1s infinite; opacity: 0; }
    </style>
  </defs>

  <rect x="12" y="12" width="244" height="204" rx="18" fill="#FF6FB5" stroke="#241E4E" stroke-width="2.5"/>
  <rect x="4" y="4" width="244" height="204" rx="18" fill="#FFF6EC"/>

  <g clip-path="url(#c)">
    <rect x="0" y="0" width="260" height="158" fill="#241E4E"/>
    <g fill="#FFF6EC">
      <circle cx="96" cy="50" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="44" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="70" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- swaying spotlight -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-14 126 26;14 126 26;-14 126 26" dur="5s" repeatCount="indefinite"/>
      <polygon points="118,26 134,26 168,156 84,156" fill="#FFD45C" opacity="0.4"/>
    </g>

    <rect x="0" y="152" width="260" height="14" fill="#FFD45C" stroke="#241E4E" stroke-width="2.5"/>

    <!-- curtains -->
    <path d="M0 0 H68 C56 50 58 92 74 124 C60 128 40 140 26 152 H0 Z" fill="#FF6FB5" stroke="#241E4E" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M22 4 C18 50 22 100 18 148 M44 4 C38 40 44 90 50 130" fill="none" stroke="#241E4E" stroke-width="1.6" stroke-opacity="0.45"/>
    <circle cx="70" cy="122" r="4.5" fill="#FFD45C" stroke="#241E4E" stroke-width="2"/>
    <path d="M252 0 H184 C196 50 194 92 178 124 C192 128 212 140 226 152 H252 Z" fill="#FF6FB5" stroke="#241E4E" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M230 4 C234 50 230 100 234 148 M208 4 C214 40 208 90 202 130" fill="none" stroke="#241E4E" stroke-width="1.6" stroke-opacity="0.45"/>
    <circle cx="182" cy="122" r="4.5" fill="#FFD45C" stroke="#241E4E" stroke-width="2"/>
    <path d="M0 0 H260 V26 q-11 10 -22 0 t-22 0 t-22 0 t-22 0 t-22 0 t-22 0 t-22 0 t-22 0 t-22 0 t-22 0 t-22 0 t-22 0 V0 Z" fill="#5B7CFA" stroke="#241E4E" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- the singing hard hat -->
    <g transform="translate(126 150) scale(1.35) translate(-126 -150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 126 148;4 126 148;-4 126 148" dur="2s" repeatCount="indefinite"/>
      <circle cx="126" cy="110" r="16" fill="#FF6FB5"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="0.9s" repeatCount="indefinite"/></circle>
      <rect x="119" y="104" width="14" height="14" rx="5" fill="#FF6FB5" stroke="#241E4E" stroke-width="2"/>
      <path d="M98 142 C98 108 154 108 154 142 Z" fill="#FFD45C" stroke="#241E4E" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="88" y="138" width="76" height="9" rx="4.5" fill="#FFD45C" stroke="#241E4E" stroke-width="2.5"/>
      <path d="M110 127 q4 -4 8 0 M134 127 q4 -4 8 0" fill="none" stroke="#241E4E" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="126" cy="133" rx="4" ry="4" fill="#241E4E"><animate attributeName="ry" values="4;1.8;4" dur="0.8s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="106" cy="132" rx="4" ry="2.4" fill="#FF6FB5"/>
      <ellipse cx="146" cy="132" rx="4" ry="2.4" fill="#FF6FB5"/>
    </g>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#FFF6EC">
      <text class="n1" x="160" y="100">♪</text>
      <text class="n2" x="84" y="100">♫</text>
      <text class="n3" x="170" y="86">♪</text>
    </g>
  </g>

  <text x="126" y="193" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#241E4E">NO.01 · A SAFETY OPERA</text>
  <rect x="4" y="4" width="244" height="204" rx="18" fill="none" stroke="#241E4E" stroke-width="2.5"/>
</svg>
