<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 232" width="1000" height="232" role="img" aria-label="Impact metrics: false negatives reduced from 44.5 percent to 0 percent across 593 labeled cases; hazards detected 28 minutes earlier; 1.26 second median push-to-search latency">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#071525"/>
      <stop offset="100%" stop-color="#0A1F2E"/>
    </linearGradient>
    <linearGradient id="barAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="barTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="divV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#2DD4BF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes popUp { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform: translateY(0);} }
      @keyframes softIn { from { opacity:0;} to { opacity:1;} }
      .c1 { animation: popUp .8s cubic-bezier(.22,.8,.3,1) .10s both; }
      .c2 { animation: popUp .8s cubic-bezier(.22,.8,.3,1) .30s both; }
      .c3 { animation: popUp .8s cubic-bezier(.22,.8,.3,1) .50s both; }
      .cap{ animation: softIn 1s ease-out .9s both; }
    </style>
  </defs>

  <rect width="1000" height="232" rx="16" fill="url(#mBg)" stroke="#2DD4BF" stroke-opacity="0.18"/>

  <text x="48" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" letter-spacing="4" fill="#FFB84D" fill-opacity="0.9">MEASURED OUTCOMES</text>

  <line x1="350" y1="56" x2="350" y2="200" stroke="url(#divV)" stroke-width="1"/>
  <line x1="683" y1="56" x2="683" y2="200" stroke="url(#divV)" stroke-width="1"/>

  <!-- 01 false negatives -->
  <g class="c1">
    <text x="48" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" letter-spacing="2.6" fill="#5F7D93">FALSE NEGATIVES</text>
    <text x="48" y="138" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="50" font-weight="700" fill="#FFB84D">0%</text>
    <text x="126" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#2DD4BF">&#8595; from 44.5%</text>
    <rect x="48" y="156" width="256" height="5" rx="2.5" fill="#0F2231"/>
    <rect x="48" y="156" width="256" height="5" rx="2.5" fill="url(#barAmber)">
      <animate attributeName="width" from="256" to="0" dur="1.5s" begin="0.7s" fill="freeze"
               calcMode="spline" keySplines="0.22 0.8 0.3 1"/>
    </rect>
    <text class="cap" x="48" y="188" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="12.5" fill="#8CA3B8">across 593 labeled cases <tspan fill="#46607A">· SOP Opera</tspan></text>
  </g>

  <!-- 02 earlier detection -->
  <g class="c2">
    <text x="381" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" letter-spacing="2.6" fill="#5F7D93">EARLIER DETECTION</text>
    <text x="381" y="138" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="50" font-weight="700" fill="#5EEAD4">28<tspan font-size="22" font-weight="600" fill="#2DD4BF"> min</tspan></text>
    <rect x="381" y="156" width="256" height="5" rx="2.5" fill="#0F2231"/>
    <rect x="381" y="156" width="0" height="5" rx="2.5" fill="url(#barTeal)">
      <animate attributeName="width" from="0" to="222" dur="1.5s" begin="0.9s" fill="freeze"
               calcMode="spline" keySplines="0.22 0.8 0.3 1"/>
    </rect>
    <text class="cap" x="381" y="188" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="12.5" fill="#8CA3B8">ahead of single-sensor thresholds</text>
  </g>

  <!-- 03 latency -->
  <g class="c3">
    <text x="714" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" letter-spacing="2.6" fill="#5F7D93">PUSH &#8594; SEARCH</text>
    <text x="714" y="138" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="50" font-weight="700" fill="#7DD3FC">1.26<tspan font-size="22" font-weight="600" fill="#38BDF8"> s</tspan></text>
    <rect x="714" y="156" width="238" height="5" rx="2.5" fill="#0F2231"/>
    <rect x="714" y="156" width="0" height="5" rx="2.5" fill="url(#barTeal)">
      <animate attributeName="width" from="0" to="166" dur="1.5s" begin="1.1s" fill="freeze"
               calcMode="spline" keySplines="0.22 0.8 0.3 1"/>
    </rect>
    <circle cx="884" cy="158.5" r="3.4" fill="#FFB84D" opacity="0">
      <animate attributeName="opacity" values="0;0;0.4;1;0.4;1" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="cap" x="714" y="188" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="12.5" fill="#8CA3B8">median · p95 1.60s <tspan fill="#46607A">· FlowSync</tspan></text>
  </g>
</svg>
